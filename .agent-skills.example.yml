# =============================================================================
# agent-skills — committed project configuration template
#
# OPTIONAL for local work. On a machine with the global install, project context
# is inferred from the repository itself (git root, remote, base branch, stack,
# build system, package manager, commands, CI). Check what is already known
# before adding anything here:
#
#   agent-skills project
#
# Add this file when inference is not good enough — an unusual build command, a
# non-conventional base branch, a coverage target — or when the repository runs
# in a CLOUD agent, which cannot see your machine and therefore needs the
# in-repo mode below.
#
# REQUIRED for cloud / in-repo hosts: GitHub Copilot coding agent (github.com),
# Cursor cloud / background agents, Devin, Codespaces, Gitpod, Claude.ai web
# with the repo attached.
#
# How to use:
#   1. Copy this file to `.agent-skills.yml` at the repository root.
#   2. Keep ONLY the keys you actually need. Delete the rest.
#   3. Commit it. It contains NO secrets, and it must never name a credential
#      identity either — see the security note below.
#   4. Add `.cache/` to `.gitignore`.
#   5. Inject any secrets via the host platform's own mechanism, or let
#      `agent-skills access resolve` handle them locally.
#
# ---------------------------------------------------------------------------
# SECURITY: this file is committed, so anyone who can open a pull request can
# edit it. Two rules follow, and both are enforced rather than advisory:
#
#   * No credential VALUES here. Ever.
#   * No credential PROFILE NAMES here. This file may declare WHAT a service is
#     (a name, a host); it may not choose WHICH identity to unlock. A
#     `credentials:` block in a committed file is ignored.
#
# Profile selection comes from the user-global binding registry
# (`agent-skills access bind`) or from an untracked `.agent-skills.local.yml`,
# whose untrackedness is verified with git. See docs/access-resolution.md.
# ---------------------------------------------------------------------------
#
# See docs/configuration.md and docs/execution-modes.md.
# =============================================================================

# Only needed for cloud / remote agents. Omit it for local work: the global
# install is detected automatically.
mode: in-repo

# Display name used in summaries and stakeholder-ready output.
# REQUIRED. EXAMPLE: "Acme Platform".
org_name: ""

# Email/identity domain for the org. OPTIONAL.
# EXAMPLE: "acme.example.com". Defaults to "localhost" for local dry runs.
org_domain: "localhost"

# Source-control context (only needed for clone/push/PR-aware work).
# github_org EXAMPLE: "acme-eng". Leave blank for read-only planning.
github_org: ""
github_default_branch: "main"

# The single project this repo represents.
project:
  name: "" # short identifier
  stack: "" # java | typescript | python | go | mixed | other
  base_branch: "main"
  build: "" # full build-and-test command, e.g. "mvn clean verify" or "pytest"
  format: "" # formatter command, e.g. "ruff check . && ruff format --check ."
  runtime_version: "" # optional, e.g. "21" / "20" / "3.12"
  coverage_target: "" # optional, percentage as a string, e.g. "80"
  notes: "" # optional free-text reminders

# Optional issue-system context. HOST METADATA ONLY — never a credential value
# and never a credential profile name.
#
# Locally, `agent-skills access resolve --service jira ...` establishes access
# on demand and stores any secret in the OS credential store. In a cloud agent
# there is no local store, so the platform injects secrets as environment
# variables and the resolver picks them up at step 2.
# See docs/access-resolution.md.
jira:
  host: "" # e.g. "https://acme.atlassian.net" — full URL, NO credentials
  default_project_key: "" # e.g. "ABC". Project key prefix from ticket IDs
                          # like ABC-123. NOT the API token.
  project_keys: "" # OPTIONAL. Comma-separated, e.g. "ABC,PLAT,KVB".
  login: "" # OPTIONAL. e.g. "person@acme.example.com". Required for basic auth.
  auth_type: "bearer" # bearer | basic

# Optional Confluence context (often paired with Jira). Credentials come from
# env vars (CONFLUENCE_API_TOKEN). Only host metadata goes here.
confluence:
  host: "" # e.g. "https://acme.atlassian.net/wiki" (Cloud)
           # or "https://confluence.acme.example.com" (self-hosted)
  login: "" # OPTIONAL. Usually same as jira.login on Atlassian Cloud.
  space_keys: "" # OPTIONAL. Comma-separated, e.g. "ENG,ARCH,RUN".

# Optional cache override. Defaults to <repo-root>/.cache/agent-skills/.
# Useful on ephemeral runners that want to redirect the cache to a tmpfs path.
cache_dir: ""

# -----------------------------------------------------------------------------
# Writing voice. See docs/writing-voice.md.
# -----------------------------------------------------------------------------
# Everything a skill writes for a human reader should read as though a careful
# colleague wrote it. These two knobs are the only parts of that contract an
# operator needs to decide.
writing:
  # Whether written output discloses that it was AI-assisted. Some workplaces
  # require this; that is a policy call, not a skill default.
  # ALLOWED: none | trailer | footer
  #   none    - no attribution anywhere (default)
  #   trailer - one `Assisted-by:` trailer on commits
  #   footer  - one short disclosure line on PR bodies and tracker comments
  ai_attribution: "none"

  # OPTIONAL path to a local writing sample whose voice the skills should match
  # (a style guide, a handbook page, a well-written existing PR). Resolved
  # relative to this YAML file. When set, it outranks the defaults in
  # docs/writing-voice.md. EXAMPLE: "docs/voice.md".
  voice_reference: ""

# -----------------------------------------------------------------------------
# Skill-source resolution. See docs/skill-source-resolution.md.
# -----------------------------------------------------------------------------
# A workspace can have more than one place where SKILL.md files live (the
# source repo, a workspace symlink, a vendored copy in a downstream repo). This
# block tells the agent which one is canonical so it never loads two copies of
# the same skill or merges contradictory instructions.
#
# All keys are OPTIONAL. The defaults below match the behavior shipped by
# `setup.init` and the resolution order in docs/skill-source-resolution.md, so
# most users do not need to change anything.
skills:
  # Directory the agent must treat as the canonical skill source. Resolved
  # relative to this YAML file. Leave blank unless you need to override the
  # resolution order; the global install already gives one canonical answer.
  # COMMON VALUES:
  #   .agent-skills/skills      (in-repo mode, vendored copy)
  #   skills                    (working on the agent-skills repo itself)
  #   .skills                   (legacy workspace symlink, pre-v0.37.0)
  canonical_dir: ""

  # What to do when a skill name appears under multiple discovered directories.
  # ALLOWED: prefer_canonical | prefer_highest_version | ask
  # DEFAULT: prefer_canonical (use canonical_dir when set, otherwise ask).
  duplicate_policy: "prefer_canonical"

  # Path to the agent-skills source repo on disk, when present. Used by the
  # `repo-modification` rule (rule 2 in docs/skill-source-resolution.md) so
  # edits to skills land in the source repo, not the installed copy.
  # EXAMPLE: "agent-skills" (relative to this file).
  source_repo_dir: ""

  # If `true`, the resolver may fall back to `source_repo_dir` when no other
  # canonical source is configured. Set `false` for cloud agents that should
  # only ever use the vendored copy.
  allow_source_repo_fallback: true

  # If `true`, the agent emits a one-line warning when the chosen skill's
  # `metadata.version` differs from a copy it ignored at another path.
  warn_on_version_drift: true
